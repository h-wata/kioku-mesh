[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kioku-mesh"
version = "1.2.0"
description = "A shared memory mesh for AI coding agents (Zenoh transport)"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "h-wata" },
]
keywords = ["mesh", "shared-memory-mesh", "zenoh", "mcp", "agent", "memory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Topic :: Utilities",
]
dependencies = [
    "cryptography>=41.0",
    "eclipse-zenoh>=1.9.0",
    "fastmcp>=0.1.0",
    "platformdirs>=4.0",
]

[project.urls]
Homepage = "https://github.com/h-wata/kioku-mesh"
Repository = "https://github.com/h-wata/kioku-mesh"
Issues = "https://github.com/h-wata/kioku-mesh/issues"
Changelog = "https://github.com/h-wata/kioku-mesh/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "ruff==0.11.12",
]
test = [
    "fastmcp>=0.2",
    "PyYAML>=6.0",
    "pytest-xdist>=3.0",
]
completion = [
    "argcomplete>=3.0",
]

[project.scripts]
kioku-mesh = "kioku_mesh.__main__:main"
kioku-mesh-mcp = "kioku_mesh.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kioku_mesh"]

[tool.hatch.build.targets.sdist]
include = ["src/kioku_mesh", "tests", "config", "docs", "scripts", "README.md"]

# Style: 親の ~/work/.github/pyproject.toml をベースに、本プロジェクトで CPY (copyright) を除外。
# 他は google style / 119 桁 / single quotes / LF で揃える。
[tool.isort]
profile = "google"
line_length = 119

[tool.ruff]
line-length = 119
target-version = "py310"

[tool.ruff.lint]
preview = true
select = ["A", "ANN", "C4", "C90", "E", "F", "N", "Q", "W", "D", "D401", "SLF"]
ignore = [
    "ANN002",
    "ANN003",
    "ANN1",
    "ANN401",  # Generic decorator wrappers legitimately use Any.
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "D203",
    "D212",
    "D404",
    "N818",  # QueryErrorReply keeps its name by design (exception-as-marker).
]

[tool.ruff.lint.mccabe]
# 12 violations at this threshold, spread across 8 files. This is a
# detection-only first step (TASK-468): the offending functions are not
# refactored here, only made visible via per-file-ignores below.
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# Tests legitimately reach into module-private helpers and mock internals.
"tests/**" = ["SLF001"]
# One-off PIL-based image/GIF generator scripts, not shipped package code.
"docs/assets/gen_*.py" = ["ANN", "D", "N802", "N806"]
# C901 (cyclomatic complexity) pre-existing violations, tracked as debt
# rather than fixed here (TASK-468 is detection-only; refactor is future
# work). Listed per file, not silenced globally or per-function with noqa,
# so the debt stays visible in this list.
"src/kioku_mesh/__main__.py" = ["C901"]
"src/kioku_mesh/doctor.py" = ["C901"]
"src/kioku_mesh/mcp_server.py" = ["C901"]
"src/kioku_mesh/memory/local_index.py" = ["C901"]
"src/kioku_mesh/memory/local_raw_store.py" = ["C901"]
"src/kioku_mesh/memory/replication.py" = ["C901"]
"src/kioku_mesh/memory/store.py" = ["C901"]
"src/kioku_mesh/memory/visibility_migration.py" = ["C901"]
"scripts/smoke_5peer_mesh.py" = ["C901"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-annotations]
suppress-dummy-args = true

[tool.ruff.format]
quote-style = "single"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
# src/ layout: editable install なしでも `pytest` から import できるようにする。
pythonpath = ["src"]
timeout = 60
# ROS2 (colcon/ament) が shell に source されていると PYTHONPATH 経由で
# launch_testing / launch_ros の pytest11 プラグインが自動ロードされ、
# pytest 標準の caplog ハンドラ登録と衝突して WARNING ログが記録されなくなる
# (tests/test_metadata_required.py の agent_family 系アサーションが偽陽性で fail する)。
# この2プラグインは kioku-mesh の純 Python テストスイートには無関係なので明示的に無効化する。
# 未インストール環境では no-op。
addopts = "-p no:launch_testing -p no:launch_ros"
# integration: 実 zenohd を起動し replication の収束を待つテスト
# (tests/test_two_node_scope_harness.py)。既定の `pytest tests/ -q` に含める。
# これだけ回すなら `pytest -m integration`、外すなら `pytest -m "not integration"`。
markers = ["integration: spawns real zenohd routers and waits for replication"]
