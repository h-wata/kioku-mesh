services:
  zenohd:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ZENOH_VERSION: "1.9.0"
        ZENOH_TARGET: "x86_64-unknown-linux-musl"
    ports:
      - "7447:7447"
      - "8000:8000"
    volumes:
      - ./data/zenoh:/var/lib/zenoh
      - ./config/zenohd.docker.json5:/etc/zenoh/config.json5:ro
    environment:
      ZENOH_BACKEND_ROCKSDB_ROOT: /var/lib/zenoh
    command: ["-c", "/etc/zenoh/config.json5"]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "7447"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
